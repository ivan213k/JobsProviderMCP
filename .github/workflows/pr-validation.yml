name: PR Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore JobsProviderApi.slnx

      - name: Build
        run: dotnet build JobsProviderApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test JobsProviderApi.slnx --no-build --configuration Release
